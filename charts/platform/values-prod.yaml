# placeholder domain, set your own
global:
  scheme: https
  storeHost: store.example.com
  appHost: app.example.com
  storageClass: ""
store:
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      secretName: store-tls
  mysql:
    storage: 20Gi
    resources:
      requests:
        memory: 768Mi
      limits:
        memory: 1536Mi
  wordpress:
    storage: 20Gi
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi
woo-mcp:
  image: ghcr.io/your-user/woo-mcp:0.1.0
  imagePullPolicy: Always
  replicas: 2
gateway:
  image: ghcr.io/your-user/gateway:0.1.0
  imagePullPolicy: Always
  replicas: 2
mcp-extras:
  imagePullPolicy: Always
  servers:
    - name: time-mcp
      image: ghcr.io/your-user/time-mcp:0.1.0
    - name: notes-mcp
      image: ghcr.io/your-user/notes-mcp:0.1.0
dashboard:
  image: ghcr.io/your-user/dashboard:0.1.0
  imagePullPolicy: Always
  replicas: 2
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      secretName: app-tls
