apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app: woo-mcp
    app.kubernetes.io/part-of: urumi-platform
spec:
  type: ClusterIP
  selector:
    app: woo-mcp
  ports:
    - name: mcp
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
