apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app: woo-mcp
    app.kubernetes.io/part-of: urumi-platform
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: woo-mcp
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: WOO_URL
              value: {{ .Values.wooUrl | quote }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.allowedHosts | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: consumer-key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: consumer-secret
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: mcp-token
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
