apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-only-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: woo-mcp
    app.kubernetes.io/part-of: urumi-platform
spec:
  podSelector:
    matchLabels:
      app: woo-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}
          podSelector:
            matchLabels:
              app: {{ .Values.gatewayApp }}
      ports:
        - port: {{ .Values.port }}
