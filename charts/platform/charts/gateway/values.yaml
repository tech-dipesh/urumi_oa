namespace: platform
secretName: gateway-secrets
adminEmail: admin@urumi.local
image: gateway:0.1.0
imagePullPolicy: IfNotPresent
replicas: 1
port: 3000
allowedHosts: localhost,127.0.0.1,gateway,gateway.platform,gateway.platform.svc,gateway.platform.svc.cluster.local,app.localhost
callTimeoutMs: 10000
listTimeoutMs: 3000
healthIntervalMs: 30000
seeds:
  - name: woo
    url: http://woo-mcp.store.svc.cluster.local:3000/mcp
    tokenEnv: WOO_MCP_TOKEN
  - name: time
    url: http://time-mcp.platform.svc.cluster.local:3000/mcp
  - name: notes
    url: http://notes-mcp.platform.svc.cluster.local:3000/mcp
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 384Mi
postgres:
  image: postgres:18-alpine
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
